apiVersion: apps/v1
kind: Deployment
metadata:
  name: infinimesh-pairing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infinimesh-pairing
  template:
    metadata:
      labels:
        app: infinimesh-pairing
    spec:
      containers:
        - name: pairing
          image: ghcr.io/infinimesh/core/pairing:latest
          imagePullPolicy: Always
          env:
            - name: SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: infinimesh-auth
                  key: SIGNING_KEY
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: infinimesh-pairing
spec:
  selector:
    app: infinimesh-pairing
  ports:
    - port: 8000
      targetPort: 8000
