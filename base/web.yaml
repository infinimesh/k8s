apiVersion: apps/v1
kind: Deployment
metadata:
  name: infinimesh-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infinimesh-web
  template:
    metadata:
      labels:
        app: infinimesh-web
    spec:
      containers:
        - name: web
          image: ghcr.io/infinimesh/core/web:latest
          imagePullPolicy: Always
          env:
            - name: APISERVER_HOST
              value: infinimesh-repo:8000
            - name: HANDSFREE
              value: infinimesh-handsfree:8000
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: infinimesh-web
spec:
  selector:
    app: infinimesh-web
  ports:
    - port: 8000
      targetPort: 8000
