apiVersion: apps/v1
kind: Deployment
metadata:
  name: infinimesh-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infinimesh-gateway
  template:
    metadata:
      labels:
        app: infinimesh-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/infinimesh/core/gateway:latest
          imagePullPolicy: Always
          env:
            - name: APISERVER_HOST
              value: infinimesh-api:8000
            - name: PAIRING
              value: infinimesh-pairing:8000
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: infinimesh-gateway
spec:
  selector:
    app: infinimesh-gateway
  ports:
    - port: 8000
      targetPort: 8000
