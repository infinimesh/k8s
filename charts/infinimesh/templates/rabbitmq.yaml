{{- if not .Values.external.rabbitmq }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: infinimesh-rabbitmq
  namespace: {{ .Values.namespace.name }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.rabbitmq.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infinimesh-rabbitmq
  namespace: {{ .Values.namespace.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infinimesh-rabbitmq
  template:
    metadata:
      labels:
        app: infinimesh-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          imagePullPolicy: Always
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: infinimesh-auth
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: infinimesh-auth
                  key: RABBITMQ_PASS
          ports:
            - containerPort: 5672
            - containerPort: 15672
          livenessProbe:
            tcpSocket:
              port: 5672
          readinessProbe:
            tcpSocket:
              port: 5672
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: infinimesh-rabbitmq
---
apiVersion: v1
kind: Service
metadata:
  name: infinimesh-rabbitmq
  namespace: {{ .Values.namespace.name }}
spec:
  selector:
    app: infinimesh-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
{{- end }}
