apiVersion: apps/v1
kind: Deployment
metadata:
  name: infinimesh-gateway
  namespace: {{ .Values.namespace.name }}
spec:
  replicas: {{ .Values.replicas.gateway }}
  selector:
    matchLabels:
      app: infinimesh-gateway
  template:
    metadata:
      labels:
        app: infinimesh-gateway
    spec:
      containers:
        - name: gateway
          image: {{ include "infinimesh.coreImage" (dict "registry" .Values.image.registry "service" "gateway" "tag" .Values.image.tag) }}
          imagePullPolicy: {{ include "infinimesh.pullPolicy" (dict "tag" .Values.image.tag) }}
          env:
            - name: APISERVER_HOST
              value: infinimesh-api:8000
            - name: PAIRING
              value: infinimesh-pairing:8000
          ports:
            - containerPort: 8000
            - name: metrics
              containerPort: 2112
          livenessProbe:
            tcpSocket:
              port: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: infinimesh-gateway
  namespace: {{ .Values.namespace.name }}
  labels:
    app: infinimesh-gateway
    infinimesh.io/metrics: "true"
spec:
  selector:
    app: infinimesh-gateway
  ports:
    - port: 8000
      targetPort: 8000
    - name: metrics
      port: 2112
      targetPort: metrics
