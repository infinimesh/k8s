apiVersion: v1
kind: Secret
metadata:
  name: infinimesh-auth
  namespace: {{ .Values.namespace.name }}
stringData:
  ARANGO_ROOT_PASSWORD: {{ .Values.auth.arangoRootPassword | quote }}
  DB_CRED: {{ .Values.auth.dbCred | quote }}
  RABBITMQ_USER: {{ .Values.auth.rabbitmqUser | quote }}
  RABBITMQ_PASS: {{ .Values.auth.rabbitmqPass | quote }}
  RABBITMQ_CONN: {{ include "infinimesh.rabbitConn" . | quote }}
  SIGNING_KEY: {{ .Values.auth.signingKey | quote }}
  INF_DEFAULT_ROOT_PASS: {{ .Values.auth.rootPass | quote }}
