apiVersion: apps/v1
kind: Deployment
metadata:
  name: infinimesh-mqtt
  namespace: {{ .Values.namespace.name }}
spec:
  replicas: {{ index .Values.replicas "mqtt-bridge" }}
  selector:
    matchLabels:
      app: infinimesh-mqtt
  template:
    metadata:
      labels:
        app: infinimesh-mqtt
    spec:
      containers:
        - name: mqtt-bridge
          image: {{ include "infinimesh.coreImage" (dict "registry" .Values.image.registry "service" "mqtt-bridge" "tag" .Values.image.tag) }}
          imagePullPolicy: {{ include "infinimesh.pullPolicy" (dict "tag" .Values.image.tag) }}
          env:
            - name: RABBITMQ_CONN
              valueFrom:
                secretKeyRef:
                  name: infinimesh-auth
                  key: RABBITMQ_CONN
            - name: DEVICES_HOST
              value: infinimesh-api:8000
            - name: SHADOW_HOST
              value: infinimesh-shadow:8000
            - name: SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: infinimesh-auth
                  key: SIGNING_KEY
            {{- if .Values.mqtt.plaintext }}
            - name: MQTT_PLAINTEXT
              value: "1"
            {{- end }}
          ports:
            {{- if .Values.mqtt.plaintext }}
            - containerPort: 1883
            {{- end }}
            - containerPort: 8883
            - name: metrics
              containerPort: 2112
          livenessProbe:
            tcpSocket:
              port: {{ if .Values.mqtt.plaintext }}1883{{ else }}8883{{ end }}
          readinessProbe:
            tcpSocket:
              port: {{ if .Values.mqtt.plaintext }}1883{{ else }}8883{{ end }}
          volumeMounts:
            - name: cert
              mountPath: /cert
              readOnly: true
      volumes:
        - name: cert
          secret:
            secretName: infinimesh-mqtt-tls
---
apiVersion: v1
kind: Service
metadata:
  name: infinimesh-mqtt
  namespace: {{ .Values.namespace.name }}
  labels:
    app: infinimesh-mqtt
    infinimesh.io/metrics: "true"
spec:
  type: LoadBalancer
  selector:
    app: infinimesh-mqtt
  ports:
    {{- if .Values.mqtt.plaintext }}
    - name: mqtt
      port: 1883
      targetPort: 1883
    {{- end }}
    - name: tls
      port: 8883
      targetPort: 8883
    - name: metrics
      port: 2112
      targetPort: metrics
