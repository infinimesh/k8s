namespace:
  create: true
  name: infinimesh

image:
  registry: ghcr.io/infinimesh/core
  tag: v3.4.0-rc.10

replicas:
  api: 2
  shadow: 2
  mqtt-bridge: 2
  gateway: 1
  console: 1
  pairing: 1
  rules: 1
  httpFs: 1

mqtt:
  plaintext: false

coap:
  enabled: false

httpFs:
  publicURL: ""
  maxBytes: "10485760"
  types: "image/jpeg,image/png,image/gif,image/webp,application/pdf,text/plain,text/csv,application/json,application/zip,application/octet-stream"
  storage: 10Gi
  s3:
    endpoint: ""
    bucket: ""
    region: us-east-1
    pathStyle: true
    accessKey: ""
    secretKey: ""

# Compose defaults, same as base/secret.yaml.
auth:
  arangoRootPassword: openSesame
  dbCred: "root:openSesame"
  rabbitmqUser: infinimesh
  rabbitmqPass: infinimesh
  signingKey: seeeecreet
  rootPass: infinimesh

external:
  arangodb: false
  rabbitmq: false
  redis: false
  # host:port. Used only when the matching flag above is true.
  # rabbitmq is the host in amqp://user:pass@host/.
  hosts:
    arangodb: ""
    rabbitmq: ""
    redis: ""

metrics:
  serviceMonitor: false

arangodb:
  image: arangodb/arangodb:latest
  storage: 10Gi

rabbitmq:
  image: rabbitmq:3.9-management
  storage: 10Gi

redis:
  image: redis:latest
  storage: 10Gi
